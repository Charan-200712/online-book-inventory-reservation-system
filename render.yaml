# =============================================================================
# Render Blueprint Specification
# Online Book Inventory & Reservation System
# Full-Stack Deployment (Node.js Backend + React Static Frontend)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js / Express API)
  # ---------------------------------------------------------------------------
  - type: web
    name: book-inventory-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: library_db
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CLIENT_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 / Vite SPA)
  # ---------------------------------------------------------------------------
  - type: web
    name: book-inventory-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
